name: Release

on:
  push:
    branches: [main]
    paths:
      - 'wsl_compactor.ps1'
      - '.github/workflows/release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.$($env:GITHUB_RUN_NUMBER)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Stamp script version
        shell: pwsh
        run: |
          $path = ".\wsl_compactor.ps1"
          $version = "${{ steps.version.outputs.version }}"
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, '(?m)^\.VERSION\s+.*$', ".VERSION $version", 1)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: Validate script metadata
        shell: pwsh
        run: |
          Test-ScriptFileInfo -Path .\wsl_compactor.ps1 | Format-List

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Script -Path .\wsl_compactor.ps1 -NuGetApiKey $env:NUGET_API_KEY -Repository PSGallery
