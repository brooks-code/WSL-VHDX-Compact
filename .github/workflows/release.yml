name: Release (PowerShell Gallery + GitHub Release)

on:
  push:
    branches: [main]
    paths:
      - 'wsl_compactor.ps1'
      - '.github/workflows/release.yml'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Environment info
        shell: pwsh
        run: |
          Write-Host "::group::Environment"
          Write-Host ("PowerShell   : {0}" -f $PSVersionTable.PSVersion)
          Write-Host ("OS           : {0}" -f [System.Environment]::OSVersion.VersionString)
          Write-Host ("Runner image : {0}" -f $env:ImageOS)
          Write-Host "::endgroup::"

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $version = "1.0.$($env:GITHUB_RUN_NUMBER)"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Computed version: $version"

      - name: Stamp script version
        shell: pwsh
        run: |
          $path = ".\wsl_compactor.ps1"
          $version = "${{ steps.version.outputs.version }}"
          $text = Get-Content $path -Raw
          $text = [regex]::Replace($text, '(?m)^\.VERSION\s+.*$', ".VERSION $version", 1)
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, (New-Object System.Text.UTF8Encoding($false)))

      - name: Validate script metadata
        id: metadata
        shell: pwsh
        run: |
          $info = Test-ScriptFileInfo -Path .\wsl_compactor.ps1
          $info | Format-List

          Write-Host "::group::Parsed script metadata"
          Write-Host ("Name        : {0}" -f $info.Name)
          Write-Host ("Version     : {0}" -f $info.Version)
          Write-Host ("Author      : {0}" -f $info.Author)
          Write-Host ("Description : {0}" -f $info.Description)
          Write-Host ("Tags        : {0}" -f ($info.Tags -join ', '))
          Write-Host "::endgroup::"

      - name: Copy publish script
        shell: pwsh
        run: |
          Copy-Item .\wsl_compactor.ps1 .\wsl2compact.ps1 -Force

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Script -Path .\wsl2compact.ps1 -NuGetApiKey $env:NUGET_API_KEY -Repository PSGallery
          Write-Host "Published wsl2compact v${{ steps.version.outputs.version }} to PowerShell Gallery"

      # ---------- build the .exe and attach trust signals ----------

      - name: Install ps2exe
        shell: pwsh
        run: |
          Install-Module ps2exe -Force -Scope CurrentUser
          $ps2exeVersion = (Get-Module ps2exe -ListAvailable | Select-Object -First 1).Version
          Write-Host "ps2exe module version: $ps2exeVersion"

      - name: Prepare EXE source
        shell: pwsh
        run: |
          Copy-Item .\wsl_compactor.ps1 .\wsl2compact-console.ps1 -Force
          $content = @'
          
          if (-not $nonInteractive) {
            Write-Host "`nPress any key to exit..." -ForegroundColor DarkCyan
            $null = $Host.UI.RawUI.ReadKey("NoEcho,IncludeKeyDown")
          }
          '@
          Add-Content -Path .\wsl2compact-console.ps1 -Encoding utf8 -Value $content
      
      - name: Build EXE
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Invoke-ps2exe `
            -inputFile    .\wsl2compact-console.ps1 `
            -outputFile   .\wsl2compact.exe `
            -version      $version `
            -title        "WSL VHDX Compactor" `
            -description  "Compacts WSL2 distro VHDX files to reclaim disk space" `
            -company      "hyperphantasia" `
            -product      "wsl2compact" `
            -copyright    "(c) $(Get-Date -Format yyyy) hyperphantasia" `
            -requireAdmin

          $size = (Get-Item .\wsl2compact.exe).Length
          Write-Host ("Built wsl2compact.exe ({0:N0} bytes / {1:N2} MB)" -f $size, ($size / 1MB))

      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = foreach ($f in 'wsl_compactor.ps1','wsl2compact.exe') {
            "$((Get-FileHash $f -Algorithm SHA256).Hash)  $f"
          }
          $lines | Set-Content -Path checksums.txt -Encoding ascii

          Write-Host "::group::SHA256 checksums"
          $lines | ForEach-Object { Write-Host $_ }
          Write-Host "::endgroup::"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            wsl2compact.exe
            wsl_compactor.ps1

      - name: Create GitHub Release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create "v$version" `
            .\wsl2compact.exe `
            .\wsl_compactor.ps1 `
            .\checksums.txt `
            --title "v$version" `
            --generate-notes
          Write-Host "Release created: v$version"

      - name: Job summary
        shell: pwsh
        if: always()
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $ps1Hash = (Get-FileHash .\wsl_compactor.ps1 -Algorithm SHA256 -ErrorAction SilentlyContinue).Hash
          $exeHash = (Get-FileHash .\wsl2compact.exe -Algorithm SHA256 -ErrorAction SilentlyContinue).Hash
          $exeSize = if (Test-Path .\wsl2compact.exe) { "{0:N2} MB" -f ((Get-Item .\wsl2compact.exe).Length / 1MB) } else { "n/a" }

          $summary = @(
            "## Release summary",
            "",
            "| Item | Value |",
            "|---|---|",
            "| Version | ``$version`` |",
            "| PowerShell Gallery | Published as ``wsl2compact`` |",
            "| wsl_compactor.ps1 SHA256 | ``$ps1Hash`` |",
            "| wsl2compact.exe SHA256 | ``$exeHash`` |",
            "| wsl2compact.exe size | $exeSize |",
            "| Release | https://github.com/${{ github.repository }}/releases/tag/v$version |"
          ) -join "`n"

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
