name: Release
on:
  push:
    branches: [main]
    paths:
      - 'wsl_compactor.ps1'
      - 'packaging/**'
      - '.github/workflows/release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          # Major.Minor is fixed; patch is normally the run number, but we bump
          # past whatever is already live on the Gallery to avoid collisions
          # with manually-pushed versions.
          $runNumberVersion = [version]"1.0.$($env:GITHUB_RUN_NUMBER)"

          $galleryVersion = $null
          try {
            $resp = Invoke-RestMethod -UseBasicParsing `
              -Uri "https://www.powershellgallery.com/api/v2/FindPackagesById()?id='wsl2compact'"
            $versions = $resp | ForEach-Object { [version]$_.properties.Version }
            if ($versions) { $galleryVersion = $versions | Sort-Object -Descending | Select-Object -First 1 }
          } catch {
            Write-Warning "Could not query PowerShell Gallery for the current version: $_"
          }

          if ($galleryVersion -and $galleryVersion -ge $runNumberVersion) {
            $patch = $galleryVersion.Build + 1
          } else {
            $patch = $runNumberVersion.Build
          }

          $version = "1.0.$patch"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Gallery latest: $galleryVersion | run-number based: $runNumberVersion | using: $version"

      - name: Install PowerShellGet
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PowerShellGet -Force -AllowClobber -Scope CurrentUser -MinimumVersion 2.2.5

      - name: Stamp script version
        shell: pwsh
        run: |
          # Fresh pwsh process -> picks up the PowerShellGet version we just installed,
          # instead of the one that was already loaded in the previous step.
          Update-ScriptFileInfo -Path .\wsl_compactor.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Prepare Gallery publish copy
        shell: pwsh
        run: |
          # PSGallery ties the package name to the filename, and the API key
          # is scoped to the existing "wsl2compact" package - not "wsl_compactor".
          Copy-Item .\wsl_compactor.ps1 .\wsl2compact.ps1 -Force

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Script -Path .\wsl2compact.ps1 -NuGetApiKey $env:NUGET_API_KEY -Repository PSGallery

      - name: Build self-extracting .exe (IExpress, not PS2EXE)
        shell: pwsh
        run: |
          .\packaging\build-exe.ps1 -ScriptPath .\wsl_compactor.ps1 -OutputPath .\dist\Compact-WSL2-Distro.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/Compact-WSL2-Distro.exe
          generate_release_notes: true
