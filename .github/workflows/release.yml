
name: Release
on:
  push:
    branches: [main]
    paths:
      - 'wsl_compactor.ps1'
      - 'packaging/**'
      - '.github/workflows/release.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          $runNumberVersion = [version]"1.0.$($env:GITHUB_RUN_NUMBER)"

          $galleryVersion = $null
          try {
            $resp = Invoke-RestMethod -UseBasicParsing `
              -Uri "https://www.powershellgallery.com/api/v2/FindPackagesById()?id='wsl2compact'"
            $versions = $resp | ForEach-Object { [version]$_.properties.Version }
            if ($versions) { $galleryVersion = $versions | Sort-Object -Descending | Select-Object -First 1 }
          } catch {
            Write-Warning "Could not query PowerShell Gallery for the current version: $_"
          }

          if ($galleryVersion -and $galleryVersion -ge $runNumberVersion) {
            $patch = $galleryVersion.Build + 1
          } else {
            $patch = $runNumberVersion.Build
          }

          $version = "1.0.$patch"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Gallery latest: $galleryVersion | run-number based: $runNumberVersion | using: $version"

      - name: Install PowerShellGet (isolated, avoids in-use module lock)
        shell: pwsh
        run: |
          $moduleDir = "$env:RUNNER_TEMP\psmodules"
          New-Item -ItemType Directory -Path $moduleDir -Force | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Save-Module -Name PowerShellGet -Path $moduleDir -MinimumVersion 2.2.5 -Repository PSGallery -Force
          # Prepend so subsequent steps (fresh pwsh processes) resolve this
          # version FIRST, instead of the inbox copy that's locked in-use.
          "PSModulePath=$moduleDir;$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify PowerShellGet version in use
        shell: pwsh
        run: |
          Import-Module PowerShellGet -MinimumVersion 2.2.5 -Force
          Get-Module PowerShellGet | Select-Object Name, Version, Path

      - name: Normalize script line endings/encoding
        shell: pwsh
        run: |
                $path = ".\wsl_compactor.ps1"
                $content = Get-Content -Path $path -Raw
                # Collapse to LF then force CRLF everywhere, and write back with no BOM -
                # PowerShellGet's PSScriptInfo parser requires CRLF and chokes silently otherwise.
                $content = $content -replace "`r`n", "`n"
                $content = $content -replace "`n", "`r`n"
                $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
                [System.IO.File]::WriteAllText((Resolve-Path $path), $content, $utf8NoBom)

      - name: Stamp script version
        shell: pwsh
        run: |
          Update-ScriptFileInfo -Path .\wsl_compactor.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Prepare Gallery publish copy
        shell: pwsh
        run: |
          # Gallery package name/identity comes from the filename ("wsl2compact"),
          # not "wsl_compactor": copy so we publish under the name the API key owns.
          Copy-Item .\wsl_compactor.ps1 .\wsl2compact.ps1 -Force

      - name: Publish to PowerShell Gallery
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.PSGALLERY_API_KEY }}
        run: |
          Publish-Script -Path .\wsl2compact.ps1 -NuGetApiKey $env:NUGET_API_KEY -Repository PSGallery

      - name: Build self-extracting .exe (IExpress, not PS2EXE)
        shell: pwsh
        run: |
          .\packaging\build-exe.ps1 -ScriptPath .\wsl_compactor.ps1 -OutputPath .\dist\Compact-WSL2-Distro.exe

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: dist/Compact-WSL2-Distro.exe
          generate_release_notes: true
